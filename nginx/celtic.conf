# Port 80: HTTP to HTTPS Redirect & ACME Challenge
server {
    listen 80;
    server_name footy.jebbs.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Celtic App (HTTPS)
server {
    listen 443 ssl;
    server_name footy.jebbs.online;

    ssl_certificate     /etc/letsencrypt/live/footy.jebbs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/footy.jebbs.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # All traffic goes to Nuxt frontend.
    # Nuxt handles /api proxying internally to celtic-api container via routeRules.
    location / {
        proxy_pass http://celtic-frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
