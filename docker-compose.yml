version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: celtic-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-celtic}
      POSTGRES_USER: ${POSTGRES_USER:-celtic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - celtic_data:/var/lib/postgresql/data
    networks:
      - celtic-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celtic-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-celtic};Username=${POSTGRES_USER:-celtic};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-celtic-api}
      - Jwt__Audience=${JWT_AUDIENCE:-celtic-app}
      - AllowedOrigins=${ALLOWED_ORIGINS:-http://localhost:3000,https://footy.jebbs.online}
    depends_on:
      - db
    networks:
      - celtic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://celtic-api}
    container_name: celtic-frontend
    restart: always
    environment:
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://celtic-api}
    depends_on:
      - api
    networks:
      - celtic-network
      - nginx-proxy-net

networks:
  celtic-network:
    driver: bridge
  nginx-proxy-net:
    external: true

volumes:
  celtic_data:
